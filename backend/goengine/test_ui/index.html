<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Server Studio — Go Backend Test</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0d1117;--s:#161b22;--s2:#21262d;--b:#30363d;--t:#e6edf3;--d:#8b949e;--a:#58a6ff;--g:#3fb950;--r:#f85149;--o:#d29922}
    body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
    .hdr{background:linear-gradient(135deg,#161b22,#1a1f2e);border-bottom:1px solid var(--b);padding:13px 22px;display:flex;align-items:center;gap:10px}
    .hdr h1{font-size:16px;font-weight:600;background:linear-gradient(135deg,var(--a),#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .dot{width:9px;height:9px;border-radius:50%;animation:pulse 2s infinite}
    .dot.on{background:var(--g)}.dot.off{background:var(--r)}.dot.ld{background:var(--o)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .wrap{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:13px}
    .card h2{font-size:11px;font-weight:600;color:var(--d);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
    .full{grid-column:1/-1}
    input,textarea,select{background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t);padding:6px 10px;font-size:13px;width:100%;outline:none;transition:border-color .2s}
    input:focus,textarea:focus{border-color:var(--a)}
    textarea{resize:vertical;min-height:65px;font-family:inherit}
    button{background:var(--a);color:#fff;border:none;border-radius:6px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s}
    button:hover{opacity:.85}button.danger{background:var(--r)}button.sec{background:var(--s2);border:1px solid var(--b)}
    .row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .stat{background:var(--s2);border-radius:6px;padding:8px 10px}
    .stat .l{font-size:10px;color:var(--d);text-transform:uppercase;letter-spacing:.5px}
    .stat .v{font-size:14px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #msgs{max-height:360px;overflow-y:auto;margin-bottom:9px;display:flex;flex-direction:column;gap:6px}
    .msg{padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;max-width:85%;white-space:pre-wrap;word-break:break-word}
    .msg.user{background:var(--a);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
    .msg.bot{background:var(--s2);align-self:flex-start;border-bottom-left-radius:2px}
    .ml{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto}
    .mi{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;background:var(--s2);border-radius:6px;cursor:pointer;transition:background .15s;font-size:12px}
    .mi:hover{background:var(--b)}
    .log{font-family:'Cascadia Code',monospace;font-size:11px;color:var(--d);max-height:120px;overflow-y:auto;background:var(--bg);border-radius:6px;padding:8px;white-space:pre-wrap}
    .pb{height:3px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:5px}
    .pf{height:100%;background:var(--a);transition:width .3s}
    label{font-size:12px;color:var(--d);display:block;margin-bottom:3px}
    .params{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:9px}
  </style>
</head>
<body>
<div class="hdr">
  <div class="dot off" id="dot"></div>
  <h1>AI Server Studio — Go Backend Test</h1>
  <span id="stxt" style="color:var(--d);font-size:12px">Connecting...</span>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
    <label style="font-size:11px;color:var(--d);margin:0">Port:</label>
    <input type="number" id="port-input" value="1234" min="1" max="65535"
      style="width:70px;padding:3px 7px;font-size:12px"
      onchange="updatePort(this.value)" onkeydown="if(event.key==='Enter')updatePort(this.value)"/>
    <span id="eng-badge" style="font-size:11px;padding:2px 8px;border-radius:10px;background:var(--s2);border:1px solid var(--b);color:var(--d)">—</span>
  </div>
</div>

<div class="wrap">
  <div class="card full">
    <h2>🔐 Local Authentication</h2>
    <div class="g2">
      <input type="email" id="auth-email" placeholder="Email" value="smoke@example.com"/>
      <input type="password" id="auth-password" placeholder="Password"/>
    </div>
    <div class="row">
      <button onclick="signIn()">Sign in</button>
      <button class="sec" onclick="signUp()">Create account</button>
      <span id="auth-status" style="font-size:12px;color:var(--d);align-self:center">Not signed in</span>
    </div>
  </div>

  <!-- Status -->
  <div class="card">
    <h2>⚡ Engine Status</h2>
    <div class="g2">
      <div class="stat"><div class="l">Status</div><div class="v" id="e-status">Offline</div></div>
      <div class="stat"><div class="l">Model</div><div class="v" id="e-model">None</div></div>
      <div class="stat"><div class="l">Backend</div><div class="v" id="e-backend">—</div></div>
      <div class="stat"><div class="l">Port</div><div class="v" id="e-port">1234</div></div>
      <div class="stat"><div class="l">GPU</div><div class="v" id="e-gpu">—</div></div>
      <div class="stat"><div class="l">Binary</div><div class="v" id="e-binary" style="font-size:11px">—</div></div>
    </div>
  </div>

  <!-- Hardware -->
  <div class="card">
    <h2>🖥️ Hardware</h2>
    <div class="g2">
      <div class="stat"><div class="l">CPU</div><div class="v" id="hw-cpu">—</div></div>
      <div class="stat"><div class="l">RAM</div><div class="v" id="hw-ram">—</div></div>
      <div class="stat"><div class="l">GPU</div><div class="v" id="hw-gpu">—</div></div>
      <div class="stat"><div class="l">VRAM</div><div class="v" id="hw-vram">—</div></div>
    </div>
    <div class="pb" style="margin-top:8px"><div class="pf" id="cpu-bar" style="width:0%"></div></div>
    <div style="font-size:10px;color:var(--d);margin-top:3px">CPU <span id="cpu-pct">0</span>% · RAM <span id="ram-pct">0</span>%</div>
  </div>

  <!-- Load Model -->
  <div class="card">
    <h2>📦 Load Model</h2>
    <input type="text" id="mpath" placeholder="Full path to .gguf model file..." />
    <div class="g2" style="margin-top:7px">
      <div><label>GPU Layers</label><input type="number" id="gpu-layers" value="99" min="0" max="999"/></div>
      <div><label>Context Size</label><input type="number" id="ctx-size" value="4096" min="512" max="131072"/></div>
    </div>
    <div class="row">
      <button onclick="loadModel()">Load</button>
      <button class="danger" onclick="unloadModel()">Unload</button>
      <button class="sec" onclick="scanModels()">Scan Dir</button>
    </div>
    <div class="ml" id="mlist" style="margin-top:9px"></div>
  </div>

  <!-- Available Models -->
  <div class="card">
    <h2>📂 Available Models</h2>
    <div class="ml" id="avail"></div>
    <div class="row">
      <button class="sec" onclick="scanModels()">Refresh</button>
    </div>
  </div>

  <!-- Chat -->
  <div class="card full">
    <h2>💬 Chat</h2>
    <div class="params">
      <div><label>Temperature</label><input type="number" id="temp" value="0.7" min="0" max="2" step="0.1"/></div>
      <div><label>Max Tokens</label><input type="number" id="maxtok" value="2048" min="64" max="32768"/></div>
      <div><label>System Prompt</label><input type="text" id="sysprompt" placeholder="Optional system prompt..."/></div>
    </div>
    <div id="msgs"></div>
    <div style="display:flex;gap:7px">
      <textarea id="cinput" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
      <div style="display:flex;flex-direction:column;gap:5px">
        <button onclick="sendChat()">Send</button>
        <button class="danger" onclick="stopChat()">Stop</button>
        <button class="sec" onclick="clearChat()">Clear</button>
      </div>
    </div>
  </div>

  <!-- Download -->
  <div class="card">
    <h2>⬇️ Download Model</h2>
    <div><label>URL (HuggingFace .gguf)</label><input type="text" id="dl-url" placeholder="https://huggingface.co/.../model.gguf"/></div>
    <div style="margin-top:7px"><label>Destination Directory</label><input type="text" id="dl-dir" placeholder="A:/AI/models"/></div>
    <div style="margin-top:7px"><label>Filename</label><input type="text" id="dl-name" placeholder="model.gguf"/></div>
    <div class="row">
      <button onclick="startDownload()">Download</button>
      <button class="sec" onclick="checkDownload()">Check Progress</button>
    </div>
    <div class="pb"><div class="pf" id="dl-bar" style="width:0%"></div></div>
    <div id="dl-info" style="font-size:11px;color:var(--d);margin-top:4px"></div>
  </div>

  <!-- Log -->
  <div class="card">
    <h2>📋 Log</h2>
    <div class="log" id="log"></div>
    <div class="row"><button class="sec" onclick="document.getElementById('log').textContent=''">Clear</button></div>
  </div>
</div>

<script>
let BASE = 'http://localhost:' + (new URLSearchParams(location.search).get('port') || '1234');
const logEl = document.getElementById('log');
let chatHistory = [];
let abortCtrl = null;
let authToken = localStorage.getItem('ai-server-auth-token') || '';

function isAuthenticated() {
  return authToken.trim() !== '';
}

async function apiFetch(path, options = {}) {
  if (!isAuthenticated()) {
    throw new Error('Sign in or create an account first');
  }
  const headers = new Headers(options.headers || {});
  if (authToken) headers.set('Authorization', `Bearer ${authToken}`);
  const response = await fetch(`${BASE}${path}`, {...options, headers});
  if (response.status === 401) {
    authToken = '';
    localStorage.removeItem('ai-server-auth-token');
    document.getElementById('auth-status').textContent = 'Session expired; sign in again';
    throw new Error('Authentication required');
  }
  return response;
}

async function signIn() {
  await authenticate('/v1/auth/signin');
}

async function signUp() {
  await authenticate('/v1/auth/signup', true);
}

async function authenticate(path, signup = false) {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { lg('Enter an email and password first'); return; }
  try {
    const body = {email, password};
    if (signup) body.display_name = email.split('@')[0];
    const r = await fetch(`${BASE}${path}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error?.message || `Authentication failed (${r.status})`);
    authToken = d.token || '';
    localStorage.setItem('ai-server-auth-token', authToken);
    document.getElementById('auth-status').textContent = `Signed in as ${d.user?.email || email}`;
    lg(`Authenticated as ${d.user?.email || email}`);
    fetchHW(); scanModels();
  } catch(e) {
    document.getElementById('auth-status').textContent = 'Authentication failed';
    lg(e.message);
  }
}

function updatePort(p) {
  p = parseInt(p);
  if (!p || p < 1 || p > 65535) return;
  BASE = 'http://localhost:' + p;
  document.getElementById('port-input').value = p;
  lg(`Switched to port ${p}`);
  pollStatus();
  if (isAuthenticated()) {
    fetchHW();
    scanModels();
  }
}

function lg(msg) {
  logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function fmt(b) {
  if (!b) return '—';
  const gb = b / 1073741824;
  return gb >= 1 ? `${gb.toFixed(1)} GB` : `${(b/1048576).toFixed(0)} MB`;
}

async function pollStatus() {
  if (!isAuthenticated()) {
    document.getElementById('dot').className = 'dot off';
    document.getElementById('stxt').textContent = 'Sign in required';
    document.getElementById('e-status').textContent = 'Sign in required';
    return;
  }
  try {
    const r = await apiFetch('/v1/system/status', {signal: AbortSignal.timeout(1500)});
    const d = await r.json();
    const dot = document.getElementById('dot');
    const stxt = document.getElementById('stxt');
    if (d.loading) {
      dot.className = 'dot ld'; stxt.textContent = 'Loading model...';
      document.getElementById('e-status').textContent = 'Loading';
    } else if (d.loaded) {
      dot.className = 'dot on'; stxt.textContent = `Model: ${d.modelName}`;
      document.getElementById('e-status').textContent = 'Ready';
      document.getElementById('e-model').textContent = d.modelName || '—';
    } else {
      dot.className = 'dot on'; stxt.textContent = 'No model loaded';
      document.getElementById('e-status').textContent = 'Idle';
      document.getElementById('e-model').textContent = 'None';
    }
    document.getElementById('e-backend').textContent = d.backend || 'llama.cpp';
    document.getElementById('eng-badge').textContent = d.backend || 'llama.cpp';
    document.getElementById('e-port').textContent = BASE.split(':').pop();
    // GPU + binary info
    const gpuText = d.gpuBackend && d.gpuBackend !== 'none'
      ? `${d.gpuBackend} (${d.gpuLayers} layers)` : 'CPU only';
    document.getElementById('e-gpu').textContent = gpuText;
    const variantText = d.binaryVariant
      ? `${d.binaryVariant}${d.binaryVersion ? ' ' + d.binaryVersion : ''}${d.binaryFallback ? ' ⚠ fallback' : ''}`
      : (d.binaryPath ? d.binaryPath.split(/[\\/]/).pop() : 'not found');
    document.getElementById('e-binary').textContent = variantText;
    if (d.binaryFallback && d.gpuBackend !== 'none') {
      document.getElementById('e-binary').style.color = 'var(--o)';
    }
  } catch {
    document.getElementById('dot').className = 'dot off';
    document.getElementById('stxt').textContent = 'Engine offline';
    document.getElementById('e-status').textContent = 'Offline';
  }
}

async function fetchHW() {
  if (!isAuthenticated()) return;
  try {
    const r = await apiFetch('/v1/system/hardware');
    const d = await r.json();
    document.getElementById('hw-cpu').textContent = d.cpu?.name || '—';
    document.getElementById('hw-ram').textContent = fmt(d.memory?.totalRam);
    if (d.gpus?.length) {
      document.getElementById('hw-gpu').textContent = d.gpus[0].name;
      document.getElementById('hw-vram').textContent = fmt(d.gpus[0].vram);
    }
  } catch(e) { lg('HW fetch failed: ' + e.message); }
}

async function pollUsage() {
  if (!isAuthenticated()) return;
  try {
    const r = await apiFetch('/v1/system/usage');
    const d = await r.json();
    document.getElementById('cpu-pct').textContent = d.cpuPercent?.toFixed(1) || '0';
    document.getElementById('ram-pct').textContent = d.ramTotal ? ((d.ramUsed/d.ramTotal)*100).toFixed(1) : '0';
    document.getElementById('cpu-bar').style.width = (d.cpuPercent || 0) + '%';
  } catch {}
}

async function scanModels() {
  if (!isAuthenticated()) return;
  try {
    const r = await apiFetch('/v1/models/available');
    const d = await r.json();
    const avail = document.getElementById('avail');
    const mlist = document.getElementById('mlist');
    if (!d.data?.length) {
      avail.innerHTML = '<div style="color:var(--d);padding:6px;font-size:12px">No .gguf models found</div>';
      mlist.innerHTML = '';
      return;
    }
    const html = d.data.map(m => `
      <div class="mi" onclick="selectModel('${m.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
        <span>${m.id}</span><span style="color:var(--d)">${fmt(m.size_bytes)}</span>
      </div>`).join('');
    avail.innerHTML = html;
    mlist.innerHTML = html;
    lg(`Found ${d.data.length} models`);
  } catch(e) { lg('Scan failed: ' + e.message); }
}

function selectModel(path) {
  document.getElementById('mpath').value = path;
  lg('Selected: ' + path);
}

async function loadModel() {
  const path = document.getElementById('mpath').value.trim();
  if (!path) return;
  const ngl = parseInt(document.getElementById('gpu-layers').value) || 99;
  const ctx = parseInt(document.getElementById('ctx-size').value) || 4096;
  lg(`Loading: ${path} (gpu_layers=${ngl}, ctx=${ctx})`);
  try {
    const r = await apiFetch('/v1/models/load', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model_path: path, config: {n_gpu_layers: ngl, n_ctx: ctx}})
    });
    const d = await r.json();
    if (d.ok) lg(`Loaded: ${d.model}`);
    else lg(`Error: ${d.error?.message || JSON.stringify(d)}`);
  } catch(e) { lg('Load failed: ' + e.message); }
}

async function unloadModel() {
  try {
    await apiFetch('/v1/models/unload', {method:'POST'});
    lg('Model unloaded');
  } catch(e) { lg('Unload failed: ' + e.message); }
}

async function sendChat() {
  const input = document.getElementById('cinput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div class="msg user">${esc(text)}</div>`;

  const botMsg = document.createElement('div');
  botMsg.className = 'msg bot';
  botMsg.textContent = '...';
  msgs.appendChild(botMsg);
  msgs.scrollTop = msgs.scrollHeight;

  const sysp = document.getElementById('sysprompt').value.trim();
  const messages = [];
  if (sysp) messages.push({role:'system', content: sysp});
  messages.push(...chatHistory, {role:'user', content: text});

  abortCtrl = new AbortController();
  try {
    const r = await apiFetch('/v1/chat/completions', {
      method: 'POST', signal: abortCtrl.signal,
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'local', messages,
        stream: true,
        temperature: parseFloat(document.getElementById('temp').value) || 0.7,
        max_tokens: parseInt(document.getElementById('maxtok').value) || 2048
      })
    });

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let full = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      for (const line of dec.decode(value, {stream:true}).split('\n')) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const c = JSON.parse(data)?.choices?.[0]?.delta?.content;
          if (c) { full += c; botMsg.textContent = full; msgs.scrollTop = msgs.scrollHeight; }
        } catch {}
      }
    }

    if (!full) botMsg.textContent = '(no response)';
    chatHistory.push({role:'user', content: text}, {role:'assistant', content: full});
    lg(`Response: ${full.length} chars`);
  } catch(e) {
    if (e.name !== 'AbortError') { botMsg.textContent = `Error: ${e.message}`; lg('Chat error: ' + e.message); }
    else { botMsg.textContent = full || '(stopped)'; }
  }
  abortCtrl = null;
}

async function stopChat() {
  abortCtrl?.abort();
  try { await apiFetch('/v1/chat/stop', {method:'POST'}); } catch {}
  lg('Generation stopped');
}

function clearChat() {
  chatHistory = [];
  document.getElementById('msgs').innerHTML = '';
  lg('Chat cleared');
}

async function startDownload() {
  const url = document.getElementById('dl-url').value.trim();
  const dir = document.getElementById('dl-dir').value.trim();
  const name = document.getElementById('dl-name').value.trim();
  if (!url || !dir || !name) { lg('Download: url, dir, and filename required'); return; }
  try {
    const r = await apiFetch('/v1/tasks/download', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url, dest_dir: dir, filename: name})
    });
    const d = await r.json();
    if (d.ok) { lg(`Download started: ${name}`); pollDl(name); }
    else lg(`Download error: ${d.error?.message}`);
  } catch(e) { lg('Download failed: ' + e.message); }
}

async function checkDownload() {
  const name = document.getElementById('dl-name').value.trim();
  if (!name) return;
  pollDl(name);
}

async function pollDl(name) {
  try {
    const r = await apiFetch(`/v1/tasks/${encodeURIComponent(name)}`);
    const d = await r.json();
    const pct = (d.progress * 100).toFixed(1);
    document.getElementById('dl-bar').style.width = pct + '%';
    const spd = d.speed_bps > 0 ? `${fmt(d.speed_bps)}/s` : '';
    document.getElementById('dl-info').textContent = `${pct}% · ${fmt(d.bytes_received)} / ${fmt(d.total_bytes)} ${spd}`;
    if (!d.done) setTimeout(() => pollDl(name), 1000);
    else lg(`Download complete: ${name}`);
  } catch(e) { lg('Progress check failed: ' + e.message); }
}

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// Init
pollStatus();
if (isAuthenticated()) {
  fetchHW();
  scanModels();
}
setInterval(pollStatus, 3000);
setInterval(pollUsage, 2000);
lg('Test UI ready. Engine: ' + BASE);
</script>
</body>
</html>
