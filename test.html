<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Server Studio</title>
  <style>
    :root {
      --bg: #090b10;
      --bg-2: #0d1017;
      --panel: rgba(18, 21, 29, 0.78);
      --panel-2: rgba(22, 26, 36, 0.9);
      --border: rgba(255, 255, 255, 0.07);
      --text: #f4f7ff;
      --muted: #95a0bb;
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, 0.14);
      --radius: 20px;
      --radius-sm: 14px;
      --shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,92,255,0.12), transparent 24%),
        radial-gradient(circle at top right, rgba(90,140,255,0.08), transparent 18%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      min-height: 100%;
    }

    body { padding: 18px; }

    .app {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

        .top-actions, .quick-actions, .actions-row, .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn, .mini-pill {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent-soft);
      color: white;
      border-color: rgba(124, 92, 255, 0.25);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
    }

    .main, .preview {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2px;
      border: 0;
      background: transparent;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section h2, .section h3 { margin: 0; font-size: 14px; }
    .subtext { color: var(--muted); font-size: 12px; }

    .prompt-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prompt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-select {
      width: 148px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(10,12,18,0.88);
      color: white;
      font-size: 12px;
      outline: none;
    }

    .reference-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      border: 1.5px dashed rgba(255,255,255,0.12);
      background: rgba(10,12,18,0.18);
      border-radius: 28px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    body:hover .drop-overlay {
      opacity: 1;
    }

    .drop-overlay span {
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(16,18,24,0.9);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      box-shadow: var(--shadow);
    }

    .reference-thumb {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 10px 24px rgba(0,0,0,0.24);
      flex: 0 0 auto;
    }

    .reference-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .reference-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .prompt-shell {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.025);
      padding: 12px;
    }

    .prompt-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .left-inline, .right-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .prompt-box {
      width: 100%;
      min-height: 132px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255,255,255,0.025);
      color: white;
      font-size: 14px;
      resize: vertical;
      outline: none;
    }

    .input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.025);
      color: white;
      font-size: 13px;
      outline: none;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .upload {
      min-height: 118px;
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      background: rgba(255,255,255,0.02);
    }

    .slider-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .generate-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(124,92,255,0.12), rgba(124,92,255,0.04));
      border: 1px solid rgba(124,92,255,0.16);
    }

    .generate-btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      background: linear-gradient(135deg, #7c5cff, #5f7cff);
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      min-width: 150px;
    }

    .preview-media {
      aspect-ratio: 16/11;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80') center/cover;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(8, 196, 122, 0.14);
      color: #a7f3d0;
      border: 1px solid rgba(74, 222, 128, 0.18);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      backdrop-filter: blur(10px);
    }

    .preview-actions button {
      flex: 1 1 110px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: white;
      padding: 10px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .gallery-card {
      width: 132px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
    }

    .gallery-thumb {
      height: 96px;
      background: linear-gradient(135deg, rgba(124,92,255,0.3), rgba(77,163,255,0.12));
      position: relative;
      overflow: hidden;
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8,10,14,0.56);
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .gallery-thumb:hover .gallery-overlay {
      opacity: 1;
    }

    .gallery-overlay .btn {
      color: white;
      background: rgba(16,18,24,0.82);
    }

    .gallery-info {
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .meta-box {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
    }

    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr; }
      .input-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 820px) {
      body { padding: 12px; }
      .main, .preview { padding: 14px; }
      .input-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .slider-grid, .meta-grid { grid-template-columns: 1fr; }
      .generate-bar { flex-direction: column; align-items: flex-start; }
      .generate-btn { width: 100%; }
    }

    @media (max-width: 560px) {
      .input-grid { grid-template-columns: 1fr; }
      .gallery-card { width: calc(50% - 4px); }
      .reference-row {
        align-items: flex-start;
      }
      .prompt-actions {
        flex-wrap: wrap !important;
      }
      .left-inline {
        width: 100% !important;
        flex-wrap: wrap !important;
      }
      .mode-select {
        width: 100% !important;
      }
    }
      .gallery-card { width: calc(50% - 4px); }
      .mode-select {
        width: 100%;
      }
      .reference-row {
        align-items: flex-start;
      }
      .prompt-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .right-inline {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="drop-overlay"><span>Drag & drop to add reference</span></div>
  <div class="app">
    

    <div class="layout">
      <main class="panel main">

        <section class="section">
          <div class="prompt-wrap">
            <div class="reference-row">
              <div class="reference-thumb" style="position:relative;">
                <button class="icon-btn" title="Remove reference" style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:999px;font-size:12px;background:rgba(10,12,18,0.82);">✕</button>
                <img src="/mnt/data/image.png" alt="ref" />
              </div>
            </div>

            <div class="prompt-shell">
              <textarea class="prompt-box" placeholder="Describe what you want...">Cinematic AI server studio product shot, dark glass, premium desktop app interface, realistic lighting, soft reflections.</textarea>

              <input class="input" placeholder="Negative prompt (optional)" style="margin-top:10px;" />

              <div class="prompt-actions" style="flex-wrap:nowrap;">
                <div class="left-inline" style="flex-wrap:nowrap; width:100%; justify-content:space-between;">
                  <select class="mode-select" style="width:150px; flex:0 0 auto;">
                    <option>Image</option>
                    <option>Video</option>
                    <option>Img → Vid</option>
                    <option>Vid → Vid</option>
                  </select>
                  <div style="display:flex;align-items:center;gap:8px; margin-left:auto;">
                    <button class="icon-btn" title="Voice input">🎤</button>
                    <button class="generate-btn" style="min-width:132px;">Generate</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <h3>Settings</h3>
          </div>
          <div class="input-grid">
            <div><label class="subtext">Model</label><select><option>Flux Dev</option><option>Flux Pro</option><option>SDXL</option><option>Wan 2.1</option><option>LTX Video</option><option>Hunyuan Video</option></select></div>
            <div><label class="subtext">Style</label><select><option>Default</option></select></div>
            <div><label class="subtext">Aspect</label><select><option>16:9</option></select></div>
            <div><label class="subtext">Quality</label><select><option>High</option></select></div>
            <div><label class="subtext">Duration</label><select><option>5s</option></select></div>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <div>
              <h3>Recent</h3>
              <div class="subtext">Latest generations</div>
            </div>
          </div>
          <div class="gallery">
            <div class="gallery-card">
              <div class="gallery-thumb">
                <div class="gallery-overlay"><button class="btn">Add reference</button></div>
              </div>
              <div class="gallery-info">Item</div>
            </div>
          </div>
        </section>

      </main>

      <aside class="panel preview">
        <section class="section" style="padding:12px;">
          <div class="section-header" style="margin-bottom:10px;">
            <div>
              <h2>Preview</h2>
              <div class="subtext">Current output</div>
            </div>
            <div class="mini-pill">1080p</div>
          </div>
          <div class="preview-media">
            <div class="status-badge">● Complete</div>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <div>
              <h3>Output Actions</h3>
              <div class="subtext">Minimal quick tools</div>
            </div>
          </div>
          <div class="actions-row preview-actions">
            <button>Download</button>
            <button>Remix</button>
            <button>Upscale</button>
            <button>Copy Prompt</button>
            <button>Variations</button>
            <button>Delete</button>
          </div>
        </section>

        

        <section class="section">
          <div class="section-header">
            <h3>Timeline</h3>
            <div class="subtext">Render status</div>
          </div>
          <div class="subtext">Queued → Prompt Enhanced → Rendered → Complete</div>
          <div style="height:10px"></div>
          <div style="height:8px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;">
            <div style="width:100%;height:100%;background:linear-gradient(90deg,#7c5cff,#5f7cff);"></div>
          </div>
        </section>
      </aside>
    </div>
  </div>
</body>
</html>
